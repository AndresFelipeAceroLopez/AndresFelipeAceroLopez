<svg width="700" height="230" viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="698" height="228" rx="12" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="24" y="34" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#3B82F6" filter="url(#glowB)">LANGUAGE STACK</text>
  <text x="24" y="52" font-family="Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">repository-weighted technologies</text>

  <!-- TypeScript 32% -->
  <text x="24" y="86" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8ecf5">TypeScript</text>
  <rect x="180" y="74" width="460" height="14" rx="7" fill="#1e3a5f"/>
  <rect x="180" y="74" width="0" height="14" rx="7" fill="#3B82F6" filter="url(#glowB)">
    <animate attributeName="width" from="0" to="147" dur="1.4s" fill="freeze" begin="0.1s"/>
  </rect>
  <text x="650" y="86" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#3B82F6" opacity="0">32%
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- Python 29% -->
  <text x="24" y="118" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8ecf5">Python</text>
  <rect x="180" y="106" width="460" height="14" rx="7" fill="#1e3a5f"/>
  <rect x="180" y="106" width="0" height="14" rx="7" fill="#22D3EE" filter="url(#glowB)">
    <animate attributeName="width" from="0" to="133" dur="1.4s" fill="freeze" begin="0.3s"/>
  </rect>
  <text x="650" y="118" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#22D3EE" opacity="0">29%
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- Java 16% -->
  <text x="24" y="150" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8ecf5">Java</text>
  <rect x="180" y="138" width="460" height="14" rx="7" fill="#1e3a5f"/>
  <rect x="180" y="138" width="0" height="14" rx="7" fill="#A78BFA" filter="url(#glowB)">
    <animate attributeName="width" from="0" to="74" dur="1.4s" fill="freeze" begin="0.5s"/>
  </rect>
  <text x="650" y="150" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#A78BFA" opacity="0">16%
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.7s" fill="freeze"/>
  </text>

  <!-- Dart 9% -->
  <text x="24" y="182" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8ecf5">Dart</text>
  <rect x="180" y="170" width="460" height="14" rx="7" fill="#1e3a5f"/>
  <rect x="180" y="170" width="0" height="14" rx="7" fill="#4ADE80" filter="url(#glowB)">
    <animate attributeName="width" from="0" to="41" dur="1.4s" fill="freeze" begin="0.7s"/>
  </rect>
  <text x="650" y="182" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#4ADE80" opacity="0">9%
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- CSS 4% -->
  <text x="24" y="214" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8ecf5">CSS</text>
  <rect x="180" y="202" width="460" height="14" rx="7" fill="#1e3a5f"/>
  <rect x="180" y="202" width="0" height="14" rx="7" fill="#3B82F6" filter="url(#glowB)">
    <animate attributeName="width" from="0" to="18" dur="1.4s" fill="freeze" begin="0.9s"/>
  </rect>
  <text x="650" y="214" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#3B82F6" opacity="0">4%
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.1s" fill="freeze"/>
  </text>
</svg>
