<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scanFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="158" rx="12" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- faint grid -->
  <g stroke="#1e3a5f" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
  </g>

  <!-- moving scan line -->
  <rect x="0" y="0" width="900" height="10" fill="url(#scanFade)">
    <animate attributeName="y" values="0;150;0" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- main title with flicker -->
  <text x="450" y="75" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#e8ecf5" filter="url(#glow)">
    ANDRES DEVELOPER
    <animate attributeName="opacity" values="1;0.82;1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle fade-in once -->
  <text x="450" y="105" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8" opacity="0">
    @andresfelipeacerolopez :: building with TypeScript &amp; Python
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3;1" dur="2.2s" fill="freeze"/>
  </text>

  <!-- blinking terminal cursor -->
  <rect x="620" y="93" width="10" height="16" fill="#22D3EE">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
