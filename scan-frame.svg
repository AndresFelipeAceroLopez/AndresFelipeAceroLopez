<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="hFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="298" height="298" rx="10" fill="#0a0e1a" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>

  <!-- corner brackets -->
  <g stroke="#3B82F6" stroke-width="3" fill="none" filter="url(#glowF)">
    <path d="M10,30 L10,10 L30,10"/>
    <path d="M270,10 L290,10 L290,30"/>
    <path d="M290,270 L290,290 L270,290"/>
    <path d="M30,290 L10,290 L10,270"/>
  </g>

  <!-- vertical scan sweep -->
  <rect x="0" y="0" width="10" height="300" fill="url(#hFade)">
    <animate attributeName="x" values="0;290;0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="150" y="285" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10" fill="#3B82F6" opacity="0.75">
    scanning profile...
  </text>
</svg>
