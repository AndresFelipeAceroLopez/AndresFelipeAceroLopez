<svg width="900" height="270" viewBox="0 0 900 270" xmlns="http://www.w3.org/2000/svg">
  <!-- window frame -->
  <rect x="1" y="1" width="898" height="268" rx="14" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M1 15 A13 13 0 0 1 14 1 H886 A13 13 0 0 1 899 15 V38 H1 V15 Z" fill="#111827"/>
  <line x1="1" y1="38" x2="899" y2="38" stroke="#1e3a5f" stroke-width="1"/>

  <!-- traffic lights (animated: gentle pulse) -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="19" r="6" fill="#4ADE80">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- address bar -->
  <rect x="280" y="8" width="340" height="22" rx="11" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="298" cy="19" r="5" fill="#22D3EE" opacity="0.7"/>
  <text x="450" y="23" font-family="Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">github.com/AndresFelipeAceroLopez</text>

  <!-- screenshot content -->
  <clipPath id="heroClip">
    <rect x="10" y="46" width="880" height="214" rx="8"/>
  </clipPath>
  <g clip-path="url(#heroClip)">
    <rect x="10" y="46" width="880" height="214" fill="#0a0e1a"/>
    <image href="https://www.gitskins.com/api/section/hero?username=AndresFelipeAceroLopez&amp;theme=github-dark"
           x="10" y="46" width="880" height="214" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="10" y="46" width="880" height="214" rx="8" fill="none" stroke="#1e3a5f" stroke-width="1"/>
</svg>
