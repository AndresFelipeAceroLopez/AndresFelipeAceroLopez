<svg width="340" height="60" viewBox="0 0 340 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowS" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="338" height="58" rx="29" fill="#0a0e1a" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- radar ping -->
  <circle cx="34" cy="30" r="5" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.9">
    <animate attributeName="r" from="5" to="16" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.9" to="0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="34" cy="30" r="5" fill="#4ADE80" filter="url(#glowS)"/>

  <text x="60" y="35" font-family="Menlo, Consolas, monospace" font-size="14" fill="#e8ecf5">
    Available for freelance / collab
  </text>
</svg>
